<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Grapher Interactive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <!-- Three.js Canvas -->
      <canvas id="webgl-canvas"></canvas>

      <!-- Glassmorphism UI Panel -->
      <div id="ui-panel">
        <div class="panel-header">
          <h1>3D Grapher</h1>
        </div>

        <!-- Mode Selector -->
        <div class="mode-selector">
          <button id="btn-mode-vectors" class="mode-btn active">Vectors</button>
          <button id="btn-mode-gps" class="mode-btn">GPS Globe</button>
        </div>

        <!-- Vector Form -->
        <form id="form-vectors" class="form-group">
          <div class="input-field">
            <label for="vec-magnitude">Magnitude (Initial Velocity)</label>
            <input type="number" id="vec-magnitude" step="any" min="0.1" placeholder="e.g. 50" required />
          </div>
          <div class="input-field">
            <label for="vec-elevation">Elevation Angle (degrees)</label>
            <input type="number" id="vec-elevation" step="any" placeholder="e.g. 45" required />
          </div>
          <div class="input-field">
            <label for="vec-azimuth">Azimuth Angle (degrees)</label>
            <input type="number" id="vec-azimuth" step="any" placeholder="e.g. 0" required />
          </div>
          <button type="submit" class="submit-btn">Plot Trajectory</button>
        </form>

        <!-- GPS Form -->
        <form id="form-gps" class="form-group hidden">
          <div class="input-field">
            <label for="gps-lat">Latitude (degrees)</label>
            <input type="number" id="gps-lat" step="any" placeholder="e.g. 40.7128" required />
          </div>
          <div class="input-field">
            <label for="gps-lng">Longitude (degrees)</label>
            <input type="number" id="gps-lng" step="any" placeholder="e.g. -74.0060" required />
          </div>
          <button type="submit" id="btn-submit-gps" class="submit-btn">Locate & Fetch Elevation</button>
        </form>
      </div>

      <!-- Loading Overlay -->
      <div id="loading-overlay">
        <div class="spinner"></div>
        <p>Fetching elevation data...</p>
      </div>

      <!-- Notification Toast -->
      <div id="notification"></div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
